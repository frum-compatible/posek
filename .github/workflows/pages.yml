name: Publish phone site

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the project
        run: |
          python -m unittest discover -s tests -v
          python scripts/check_project.py
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Prepare public files
        env:
          POSEK_SITE_URL: ${{ steps.pages.outputs.base_url }}
          POSEK_REPOSITORY: ${{ github.repository }}
        run: python scripts/build_site.py --output _site --site-url "$POSEK_SITE_URL" --repository "$POSEK_REPOSITORY"
      - name: Install CI browser
        run: |
          python -m pip install -r tests/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Check phone handoff and mobile layout
        run: python tests/browser_smoke.py _site _browser-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-browser-screenshots
          path: _browser-artifacts/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

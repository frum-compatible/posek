name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test retrieval contracts and evaluation reporting
        run: python -m unittest discover -s tests -v
      - name: Check skill and development-case structure
        run: python scripts/check_project.py
      - name: Prepare public files
        run: python scripts/build_site.py --output _site
      - name: Install CI browser
        run: |
          python -m pip install -r tests/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Check phone handoff and mobile layout
        run: python tests/browser_smoke.py _site _browser-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-browser-screenshots
          path: _browser-artifacts/
          if-no-files-found: ignore
